<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schere Stein Papier – Teachable Machine</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e2e; color: #fff;
         display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: clamp(1.3rem, 5vw, 2rem); margin: 0 0 12px; text-align: center; }
  .row { display: flex; gap: 8px; width: 100%; max-width: 600px; margin-bottom: 12px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 0; font-size: 1rem; min-width: 0; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; font-size: 1rem;
           background: #7c5cff; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .buttons { display: flex; gap: 8px; }
  #resetBtn { background: #e5484d; }
  #webcam-container { width: 100%; max-width: 400px; aspect-ratio: 1; background: #000;
                      border-radius: 12px; overflow: hidden; position: relative; }
  #webcam-container canvas { width: 100% !important; height: 100% !important; display: block; }
  #timer { position: absolute; top: 8px; right: 14px; font-size: 3rem; font-weight: bold;
           text-shadow: 0 0 8px #000; z-index: 2; }
  #live { margin: 10px 0; color: #7dffa0; min-height: 1.5em; }
  .scores { display: flex; gap: 12px; width: 100%; max-width: 600px; margin: 12px 0; }
  .score { flex: 1; background: #2b2b40; border-radius: 12px; padding: 12px; text-align: center; }
  .score span { display: block; font-size: 2.2rem; font-weight: bold; }
  #result { font-size: clamp(1.1rem, 4vw, 1.5rem); text-align: center; min-height: 3em; }
  #status { color: #aaa; font-size: .9rem; margin-bottom: 8px; text-align: center; }
</style>
</head>
<body>
  <h1>✊ ✋ ✌️ Schere, Stein, Papier</h1>

  <div class="row">
    <input id="modelUrl" type="text" placeholder="Link zum Modell einfügen"
           value="https://teachablemachine.withgoogle.com/models/0ODlt8_yP/">
    <button id="loadBtn">Laden</button>
  </div>
  <div id="status">Füge den Modell-Link ein und klicke auf „Laden“.</div>

  <div id="webcam-container"><div id="timer"></div></div>
  <div id="live"></div>

  <div class="buttons">
    <button id="playBtn" disabled>Runde starten</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="scores">
    <div class="score">Du<span id="scorePlayer">0</span></div>
    <div class="score">Computer<span id="scoreComputer">0</span></div>
  </div>
  <div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script>
  // Klassennamen im Modell (Groß-/Kleinschreibung egal), hier ggf. anpassen
  const MOVES = {
    rock:     ["rock", "stein", "faust"],
    paper:    ["paper", "papier"],
    scissors: ["scissors", "schere"]
  };
  const NAMES = { rock: "Stein ✊", paper: "Papier ✋", scissors: "Schere ✌️" };
  const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };

  let model, webcam, running = false, busy = false, countdown = null;
  let currentLabel = "", scores = { player: 0, computer: 0 };

  const $ = (id) => document.getElementById(id);

  function toMove(label) {
    const l = label.toLowerCase();
    for (const m in MOVES) if (MOVES[m].some(n => l.includes(n))) return m;
    return null;
  }

  $("loadBtn").onclick = async () => {
    let url = $("modelUrl").value.trim();
    if (!url) return;
    if (!url.endsWith("/")) url += "/";
    $("status").textContent = "Lade Modell …";
    $("loadBtn").disabled = true;
    try {
      if (webcam) { running = false; await webcam.stop(); $("webcam-container").querySelector("canvas")?.remove(); }
      model = await tmImage.load(url + "model.json", url + "metadata.json");
      webcam = new tmImage.Webcam(400, 400, true);
      await webcam.setup();
      await webcam.play();
      $("webcam-container").prepend(webcam.canvas);
      running = true;
      requestAnimationFrame(loop);
      $("playBtn").disabled = false;
      $("status").textContent = "Modell geladen. Klicke auf „Runde starten“.";
    } catch (e) {
      console.error(e);
      $("status").textContent = "Fehler: Modell oder Webcam konnte nicht geladen werden.";
    }
    $("loadBtn").disabled = false;
  };

  async function loop() {
    if (!running) return;
    webcam.update();
    if (!busy) {
      busy = true;
      const preds = await model.predict(webcam.canvas);
      const best = preds.reduce((a, b) => (a.probability > b.probability ? a : b));
      currentLabel = best.className;
      $("live").textContent = "Erkannt: " + best.className + " (" + Math.round(best.probability * 100) + " %)";
      busy = false;
    }
    requestAnimationFrame(loop);
  }

  $("playBtn").onclick = () => {
    $("playBtn").disabled = true;
    $("result").textContent = "";
    let t = 5;
    $("timer").textContent = t;
    countdown = setInterval(() => {
      t--;
      $("timer").textContent = t > 0 ? t : "";
      if (t <= 0) { clearInterval(countdown); countdown = null; evaluate(); }
    }, 1000);
  };

  $("resetBtn").onclick = () => {
    if (countdown) { clearInterval(countdown); countdown = null; }
    scores = { player: 0, computer: 0 };
    $("scorePlayer").textContent = 0;
    $("scoreComputer").textContent = 0;
    $("result").textContent = "";
    $("timer").textContent = "";
    $("playBtn").disabled = !running;
  };

  function evaluate() {
    const player = toMove(currentLabel);
    $("playBtn").disabled = false;
    if (!player) {
      $("result").textContent = "Keine gültige Geste erkannt („" + currentLabel + "“). Runde zählt nicht.";
      return;
    }
    const keys = Object.keys(MOVES);
    const computer = keys[Math.floor(Math.random() * keys.length)];
    let text;
    if (player === computer) {
      text = "Unentschieden!";
    } else if (BEATS[player] === computer) {
      scores.player++; text = "Du gewinnst! 🎉";
    } else {
      scores.computer++; text = "Computer gewinnt! 🤖";
    }
    $("scorePlayer").textContent = scores.player;
    $("scoreComputer").textContent = scores.computer;
    $("result").innerHTML = "Du: " + NAMES[player] + " &nbsp;|&nbsp; Computer: " + NAMES[computer] + "<br>" + text;
  }
</script>
</body>
</html>
